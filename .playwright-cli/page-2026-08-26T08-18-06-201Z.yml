    - generic [ref=f8e44]:
      - paragraph [ref=f8e45]: The Tuesday problem
      - heading "Disconnected." [level=2] [ref=f8e46]
      - paragraph [ref=f8e48]: Your business isn't a collection of departments. Why is your software?
      - paragraph [ref=f8e49]: WhatsApp holds the customer chat. Excel holds the stock count. Tally holds the books. A notebook by the machine holds the shop floor. A separate CRM holds leads nobody followed up on. None of them talk to each other.
      - paragraph [ref=f8e50]:
        - text: Ask what happened to an order on a Tuesday afternoon, and the answer is always the same —
        - emphasis [ref=f8e51]: ask Raj, he knows.
