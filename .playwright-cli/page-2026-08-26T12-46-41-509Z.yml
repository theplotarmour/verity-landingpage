    - paragraph [ref=e153]: Why it holds together
    - heading "By design." [level=2] [ref=e154]:
      - generic [ref=e155]: By
      - generic [ref=e156]: design.
    - paragraph [ref=e157]: Connected software usually breaks in three places — memory, entry and adoption. Here's how Verity holds at each.
    - generic [ref=e158]:
      - generic [ref=e159]:
        - paragraph [ref=e160]: No more ask-Raj.
        - paragraph [ref=e161]: Every order carries who confirmed it, who flagged the shortfall, and when. The answer doesn't live in one person's head anymore.
      - generic [ref=e162]:
        - paragraph [ref=e163]: Modular
        - paragraph [ref=e164]: Start with Orders or Inventory. Add Projects, Workforce or Finance when the business is ready for them — not before.
      - generic [ref=e165]:
        - paragraph [ref=e166]: No double entry.
        - paragraph [ref=e167]: Log it once — from the shop floor, a phone, or the office. It shows up already linked in Orders, Inventory and Finance.
